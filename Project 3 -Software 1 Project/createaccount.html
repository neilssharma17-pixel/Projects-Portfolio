<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="css/pixel-anvil.png">
  <title>Create a Tierforge Account</title>
  <link href="bootstrap-4.0.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/loginpage.css" rel="stylesheet">
</head>
<body class="text-center">
    <div class="cover-container d-flex h-100 p-3 mx-auto flex-column">
        <header class="masthead mb-auto">
            <div class="container d-flex justify-content-between align-items-center">
                <h3 class="masthead-brand">Tierforge</h3>
                <nav class="nav nav-masthead">
                    <a class="nav-link" href="index.html">Home</a>
                    <a class="nav-link" href="PG1.html">Create</a>
                    <a class="nav-link active" href="loginpage.html">Login</a>
                    <a class="nav-link" href="searchpage.html">Search</a>
                    <a class="nav-link" href="contact.html">Contact</a>
                </nav>
            </div>
        </header>

        <div class="cover-container d-flex flex-column align-items-center justify-content-center h-100 p-3 mx-auto">
            <form class="form-signin">
                <img class="mb-4" src="css/pixel-anvil.png" alt="" width="72" height="72">
                <h1 class="h3 mb-3 font-weight-normal">Create Your Account</h1>
                <label for="uname" class="sr-only">Email</label>
                <input type="email" id="uname" class="form-control" placeholder="Email" required>
                <label for="psw" class="sr-only">Password</label>
                <input type="password" id="psw" class="form-control" placeholder="Password" required>
                <label for="pswrepeat" class="sr-only">Confirm Password</label>
                <input type="password" id="pswrepeat" class="form-control" placeholder="Confirm Password" required>
                <div id="message" class="mt-2"></div>
                <button id="submit" class="btn btn-lg btn-primary btn-block" type="submit">Create Account</button>
            </form>
        </div>
    </div>
    <script type="module" src="js/createaccount.js"></script>
</body>
</html>
